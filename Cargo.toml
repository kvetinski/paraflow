[workspace]
members = [
  "engine-rs/crates/paraflow-contracts",
  "engine-rs/crates/paraflow-engine",
  "engine-rs/crates/paraflow-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.97.1"
authors = ["Anton Kvetinski"]
license = "Apache-2.0"
repository = "https://github.com/kvetinski/paraflow"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
debug = 1
lto = "thin"
